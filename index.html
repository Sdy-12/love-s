<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张家界学院土木招新</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
canvas{display:block}
.text-box{
    position: fixed;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    color:#ff6b81;
    font-weight:bold;
    text-align:center;
    font-size:clamp(16px,4vw,28px);
    white-space:normal;
    text-shadow:0 0 8px #ff4757;
}
</style>
</head>
<body>
<div class="text-box">
张家界学院土木工程2026年招新了！<br>
罗璇学姐一带一带你参加国赛。<br>
走过路过不要错过！！！
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
const CX = W/2, CY = H/2;
const SCALE = 11;
const COLOR = "#ff8797";

//爱心参数方程
function heartFunc(t){
    let x = 17 * Math.sin(t)**3;
    let y = -(16*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    x *= SCALE;
    y *= SCALE;
    return [x+CX, y+CY];
}

function scatterInside(x,y,beta){
    let rx = -beta * Math.log(Math.random());
    let ry = -beta * Math.log(Math.random());
    let dx = rx*(x-CX);
    let dy = ry*(y-CY);
    return [x-dx, y-dy];
}

let points = new Set();
let edgeDiff = new Set();
let centerDiff = new Set();

for(let i=0;i<2000;i++){
    let t = Math.random()*Math.PI*2;
    let [x,y] = heartFunc(t);
    points.add(x+","+y);
}

for(let pStr of points){
    let arr = pStr.split(',');
    let x = Number(arr[0]);
    let y = Number(arr[1]);
    for(let i=0;i<3;i++){
        let [nx,ny] = scatterInside(x,y,0.05);
        edgeDiff.add(nx+","+ny);
    }
}

let pointArr = Array.from(points).map(s=>{
    let arr = s.split(',');
    return [Number(arr[0]), Number(arr[1])];
});

for(let i=0;i<10000;i++){
    let idx = Math.floor(Math.random()*pointArr.length);
    let [x,y] = pointArr[idx];
    let [nx,ny] = scatterInside(x,y,0.27);
    centerDiff.add(nx+","+ny);
}

let frame = 0;
const MAX_FRAME = 20;

function curve(p){
    return 2*(2*Math.sin(4*p))/(2*Math.PI);
}

function calcPos(x,y,ratio){
    let dx = x-CX;
    let dy = y-CY;
    let force = 1 / ((dx*dx + dy*dy)**0.420);
    return [
        x - ratio*force*dx + (Math.random()>0.5?-1:1),
        y - ratio*force*dy + (Math.random()>0.5?-1:1)
    ]
}

function draw(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    let f = frame % MAX_FRAME;
    let ratio = 15 * curve(f /10 * Math.PI);

    ctx.fillStyle = COLOR;
    for(let s of points){
        let arr = s.split(',');
        let x = Number(arr[0]);
        let y = Number(arr[1]);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*3);
        ctx.fillRect(nx,ny,sz,sz);
    }
    for(let s of edgeDiff){
        let arr = s.split(',');
        let x = Number(arr[0]);
        let y = Number(arr[1]);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*2);
        ctx.fillRect(nx,ny,sz,sz);
    }
    for(let s of centerDiff){
        let arr = s.split(',');
        let x = Number(arr[0]);
        let y = Number(arr[1]);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*2);
        ctx.fillRect(nx,ny,sz,sz);
    }

    frame++;
    requestAnimationFrame(draw);
}
draw();

window.addEventListener('resize',()=>{
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
})
</script>
</body>
</html>
