<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳动爱心</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
const CX = W/2, CY = H/2;
const SCALE = 11;
const COLOR = "aquamarine";

//爱心参数方程
function heartFunc(t){
    let x = 17 * Math.sin(t)**3;
    let y = -(16*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    x *= SCALE; y *= SCALE;
    return [x+CX, y+CY];
}

function scatterInside(x,y,beta){
    let rx = -beta * Math.log(Math.random());
    let ry = -beta * Math.log(Math.random());
    let dx = rx*(x-CX);
    let dy = ry*(y-CY);
    return [x-dx, y-dy];
}

let points = new Set();
let edgeDiff = new Set();
let centerDiff = new Set();

//生成基础点
for(let i=0;i<2000;i++){
    let t = Math.random()*Math.PI*2;
    let [x,y] = heartFunc(t);
    points.add(x+","+y);
}

for(let pStr of points){
    let [x,y] = pStr.split(',').map(Number);
    for(let i=0;i<3;i++){
        let [nx,ny] = scatterInside(x,y,0.05);
        edgeDiff.add(nx+","+ny);
    }
}

let pointArr = Array.from(points).map(s=>s.split(',').map(Number));
for(let i=0;i<10000;i++){
    let [x,y] = pointArr[Math.floor(Math.random()*pointArr.length)];
    let [nx,ny] = scatterInside(x,y,0.27);
    centerDiff.add(nx+","+ny);
}

let frame = 0;
const MAX_FRAME = 20;

function curve(p){
    return 2*(2*Math.sin(4*p))/(2*Math.PI);
}

function calcPos(x,y,ratio){
    let dx = x-CX;
    let dy = y-CY;
    let force = 1 / ((dx*dx + dy*dy)**0.420);
    return [
        x - ratio*force*dx + (Math.random()>0.5?-1:1),
        y - ratio*force*dy + (Math.random()>0.5?-1:1)
    ]
}

function draw(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    let f = frame % MAX_FRAME;
    let ratio = 15 * curve(f /10 * Math.PI);

    ctx.fillStyle = COLOR;
    //绘制原始点
    for(let s of points){
        let [x,y] = s.split(',').map(Number);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*3);
        ctx.fillRect(nx,ny,sz,sz);
    }
    //边缘扩散点
    for(let s of edgeDiff){
        let [x,y] = s.split(',').map(Number);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*2);
        ctx.fillRect(nx,ny,sz,sz);
    }
    //中心扩散点
    for(let s of centerDiff){
        let [x,y] = s.split(',').map(Number);
        let [nx, ny] = calcPos(x,y,ratio);
        let sz = 1+Math.floor(Math.random()*2);
        ctx.fillRect(nx,ny,sz,sz);
    }

    frame++;
    requestAnimationFrame(draw);
}
draw();
window.addEventListener('resize',()=>{
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
})
</script>
</body>
</html>
